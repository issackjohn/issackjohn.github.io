<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 — Page not found · Issack John</title>
        <meta name="robots" content="noindex" />
        <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/styles.css" />
        <!-- Runs before first paint: applies the stored theme and marks JS as available. -->
        <script>
            (function () {
                var root = document.documentElement;
                root.classList.add("js");
                try {
                    var t = localStorage.getItem("theme");
                    if (t === "light" || t === "dark") root.setAttribute("data-theme", t);
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <a class="skip-link" href="#main">Skip to content</a>

        <header class="topbar">
            <div class="wrap">
                <a class="brand" href="/">Issack John</a>
                <nav class="site-nav" aria-label="Page navigation">
                    <a href="/">← Back to home</a>
                </nav>
            </div>
        </header>

        <main id="main" class="wrap notfound" tabindex="-1">
            <div class="notfound-code" aria-hidden="true">404</div>
            <h1>Page not found</h1>
            <p>The page you're looking for doesn't exist or has moved.</p>
            <p><a href="/">← Back to home</a></p>
        </main>

        <footer class="site-footer">
            <div class="wrap">© <span id="year">2026</span> Issack John</div>
        </footer>

        <script src="/assets/main.js" defer></script>
    </body>
</html>
